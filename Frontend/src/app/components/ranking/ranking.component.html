<div class="tela" (click)="fecharMenu()">
  <h3>Ranking - Maiores Pontuações</h3>
  <hr />

  <div class="conteudo-ranking">
    <div *ngFor="let item of rankingList; let i = index" class="linha-ranking">
      <span class="posicao">{{ i + 1 }}.</span>
      <span class="nome" (click)="abrirMenuOpcoes(item, $event)">
        {{ item.jogador }}
      </span>
      <span class="linha-guia"></span>
      <span class="pontos">{{ item.pontos }} pontos</span>
    </div>

    <div *ngIf="rankingList.length === 0" class="sem-registros">
      Nenhum registro encontrado.
    </div>
  </div>

  <!-- Caixa de opções flutuando fora da lista com scroll -->
  <div
    class="caixa-opcoes-fixa"
    *ngIf="jogadorSelecionadoMenu"
    [style.left.px]="menuPosicao.x"
    [style.top.px]="menuPosicao.y"
    (click)="$event.stopPropagation()"
  >
    <button type="button" class="btn-opcao" (click)="irParaDetalhes(jogadorSelecionadoMenu.jogador)">Detalhes</button>
    <button type="button" class="btn-opcao" (click)="irParaEdicao(jogadorSelecionadoMenu)">Editar</button>
  </div>
</div>
