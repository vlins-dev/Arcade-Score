<div class="tela">
  <h3>Registrar Pontuação</h3>
  <hr>
  <div class="campos">
    <label for="data">Data da Partida</label>
    <input 
      type="date" 
      id="data" 
      class="dtDef" 
      [(ngModel)]="data" 
      (keyup.enter)="campoPontos.focus()">
    <br>

    <label for="pontos">Pontuação</label>
    <input 
      #campoPontos
      type="number" 
      id="pontos" 
      class="pt" 
      placeholder="ex: 1234" 
      [(ngModel)]="pontuacao" 
      (keyup.enter)="campoJogador.focus()">
    <br>

    <label for="jogador">Jogador</label>
    <input 
      #campoJogador
      type="text" 
      id="jogador" 
      class="nmJg" 
      placeholder="ex: abcd" 
      [(ngModel)]="jogador" 
      (keyup.enter)="salvar()">
  </div>
  <button class="salvar" (click)="salvar()">Salvar</button>
</div>
